'use strict';

const CLOUD_URL = 'https://lsmzzcfvcywbruprpszs.supabase.co';
const CLOUD_KEY = 'sb_publishable_ZBhvn4DY2RW1vFwt2_8hsg_mlejuxSz';
const CLOUD_SESSION_KEY = 'cmancinema_cloud_session_v1';
let cloudReady=false, cloudEditor=false, cloudSession=null, cloudSnapshot=null, cloudVersion=null, cloudSaving=Promise.resolve(), cloudLoadFailed=false;
let cloudPendingSaves=0, cloudRefreshPromise=null, cloudAuthPromise=null;
const cloudExpiry=()=>cloudSession?.expires_at||(cloudSession?.expires_in&&cloudSession?.issued_at?cloudSession.issued_at+cloudSession.expires_in:0);
let cloudRestoring=true,cloudAuthError='';
function cloudStoreSession(value){
 cloudSession=value;
 try{
  if(value)localStorage.setItem(CLOUD_SESSION_KEY,JSON.stringify(value));
  else localStorage.removeItem(CLOUD_SESSION_KEY);
  sessionStorage.removeItem(CLOUD_SESSION_KEY);
 }catch(e){console.warn('Editor session storage unavailable:',e);cloudAuthError='Browser storage unavailable';}
}
function cloudIsPermanentAuthError(message){return /invalid_grant|refresh token (?:not found|already used|invalid|expired)|invalid refresh token|session_not_found|session not found/i.test(message)}
async function cloudRenewSession(force=false){
 if(!cloudSession?.refresh_token)return false;
 if(!force&&cloudExpiry()&&cloudExpiry()>Date.now()/1000+180)return true;
 if(cloudAuthPromise)return cloudAuthPromise;
 cloudAuthPromise=(async()=>{
  const response=await fetch(CLOUD_URL+'/auth/v1/token?grant_type=refresh_token',{
   method:'POST',headers:{'apikey':CLOUD_KEY,'Content-Type':'application/json'},
   body:JSON.stringify({refresh_token:cloudSession.refresh_token})
  });
  const result=await response.json();
  if(!response.ok){
   const message=result.error_description||result.msg||result.message||result.error||'Session renewal failed';
   const err=new Error(message);err.status=response.status;throw err;
  }
  if(!result.access_token||!result.refresh_token)throw Error('Incomplete session renewal response');
  cloudStoreSession({...result,issued_at:Math.floor(Date.now()/1000),expires_at:Math.floor(Date.now()/1000)+(result.expires_in||3600)});
  cloudAuthError='';cloudEditor=true;cloudControls();return true;
 })().catch(e=>{
  console.warn('CmanCinema editor session renewal:',e);
  cloudAuthError=e.message||'Session renewal failed';
  // A network failure is not a logout. Preserve the refresh token and retry on focus/online.
  // Only discard a token when the auth server explicitly rejects it as permanently invalid.
  if(e.status===400&&cloudIsPermanentAuthError(cloudAuthError)){
   cloudStoreSession(null);cloudEditor=false;cloudControls();
  }
  return false;
 }).finally(()=>{cloudAuthPromise=null});
 return cloudAuthPromise;
}
async function cloudEnsureAuth(){
 if(!cloudSession?.access_token)return false;
 const valid=await cloudRenewSession();
 if(valid){cloudEditor=true;cloudControls()}
 return valid;
}

const cloudHeaders=(token,extra={})=>({'apikey':CLOUD_KEY,'Authorization':'Bearer '+(token||CLOUD_KEY),...extra});
function cloudStatus(msg){const el=document.getElementById('cloud-status');if(el)el.textContent=msg}
function cloudControls(){
 const el=document.getElementById('cloud-controls');if(!el)return;
 const signin=document.getElementById('cloud-signin');
 const signout=document.getElementById('cloud-signout');
 const seed=document.getElementById('cloud-seed');
 signin.hidden=!!cloudEditor;signout.hidden=!cloudEditor;
 seed.hidden=!(cloudEditor&&cloudReady&&cloudVersion===null);
}
async function cloudFetch(){
 const r=await fetch(CLOUD_URL+'/rest/v1/cinema_collection?select=id,collection,updated_at&id=eq.1',
  {headers:cloudHeaders(cloudSession?.access_token)});
 if(!r.ok)throw Error('Cloud read failed ('+r.status+'): '+(await r.text()).slice(0,250));
 const rows=await r.json();return rows[0]||null;
}
function cloudApply(data){
 db=data&&Array.isArray(data.films)?data:fresh();
 db.lists||=[];db.showdowns||=[];db.settings||={tmdb:''};
 cloudSnapshot=JSON.stringify(db);
 render();
}
async function cloudRefresh(){
 if(cloudRefreshPromise)return cloudRefreshPromise;
 cloudRefreshPromise=(async()=>{
 if(cloudPendingSaves)return;
 await cloudEnsureAuth();
 cloudReady=false;
 try{
  const row=await cloudFetch();
  cloudVersion=row?.updated_at||null;
  cloudApply(row?.collection);
  cloudReady=true;cloudLoadFailed=false;
  cloudStatus((row?'Cloud collection loaded':'Cloud database empty')+' · '+(cloudEditor?'Editor':cloudSession?.refresh_token?'Editor reconnecting':'Public view')+(cloudAuthError?' · '+cloudAuthError:''));
 }catch(e){
  cloudLoadFailed=true;cloudStatus('Cloud unavailable: '+e.message);
  cloudApply(fresh());console.error(e);
 }
 cloudControls();
 })().finally(()=>{cloudRefreshPromise=null});
 return cloudRefreshPromise;
}
async function cloudLogin(){
 const email=prompt('CmanCinema editor email:');if(!email)return;
 const password=prompt('CmanCinema editor password:');if(!password)return;
 try{
  const r=await fetch(CLOUD_URL+'/auth/v1/token?grant_type=password',
   {method:'POST',headers:{'apikey':CLOUD_KEY,'Content-Type':'application/json'},body:JSON.stringify({email,password})});
  const result=await r.json();if(!r.ok)throw Error(result.msg||result.error_description||result.message||'Sign-in failed');
  cloudStoreSession({...result,issued_at:Math.floor(Date.now()/1000),expires_at:Math.floor(Date.now()/1000)+(result.expires_in||3600)});
  // A signed-in account is not automatically authorized to edit; check database owner policy on write.
  // The verified editor UID is not stored in this file. RLS is the final authority.
  cloudEditor=true;await cloudRefresh();toast('Signed in; database policies control editing.');
 }catch(e){cloudStatus('Sign-in failed: '+e.message);toast('Sign-in failed')}
}
async function cloudLogout(){
 cloudStoreSession(null);cloudEditor=false;
 await cloudRefresh();toast('Signed out');
}
async function cloudSeed(){
 if(!cloudReady||!cloudEditor||cloudVersion!==null)return;
 if(!confirm('Initialize the EMPTY cloud database with an EMPTY collection? Do not use this to import your backup.'))return;
 try{
  await cloudEnsureAuth();
  const u=await fetch(CLOUD_URL+'/auth/v1/user',{headers:cloudHeaders(cloudSession.access_token)});
  if(!u.ok)throw Error('Could not verify your editor account');
  const user=await u.json();
  const r=await fetch(CLOUD_URL+'/rest/v1/cinema_collection',
   {method:'POST',headers:cloudHeaders(cloudSession.access_token,{'Content-Type':'application/json','Prefer':'return=representation'}),
    body:JSON.stringify({id:1,owner_id:user.id,collection:fresh()})});
  if(!r.ok)throw Error('Database rejected initialization ('+r.status+'): '+(await r.text()).slice(0,180));
  await cloudRefresh();toast('Empty cloud collection initialized');
 }catch(e){cloudStatus(e.message);toast('Initialization failed')}
}
function cloudQueueSave(){
 if(!cloudReady||!cloudEditor||cloudVersion===null){cloudApply(cloudSnapshot?JSON.parse(cloudSnapshot):fresh());toast('Read-only: sign in and initialize the cloud database first');return}
 const next=JSON.stringify(db), prior=cloudSnapshot;
 cloudPendingSaves++;
 cloudSaving=cloudSaving.then(async()=>{
  if(!await cloudEnsureAuth())throw Error('Editor connection unavailable. Please reconnect before saving.');
  // Optimistic concurrency: don't silently overwrite an edit made elsewhere.
  const r=await fetch(CLOUD_URL+'/rest/v1/cinema_collection?id=eq.1&updated_at=eq.'+encodeURIComponent(cloudVersion),
   {method:'PATCH',headers:cloudHeaders(cloudSession.access_token,{'Content-Type':'application/json','Prefer':'return=representation'}),
    body:JSON.stringify({collection:JSON.parse(next),updated_at:new Date().toISOString()})});
  if(!r.ok)throw Error('Cloud save rejected ('+r.status+'): '+(await r.text()).slice(0,160));
  const rows=await r.json();if(rows.length!==1)throw Error('Cloud changed elsewhere. Reload before editing.');
  cloudVersion=rows[0].updated_at;cloudSnapshot=next;
 }).catch(async e=>{
  cloudStatus('Save failed: '+e.message);
  alert('Your last change was NOT saved to the cloud. '+e.message);
  await cloudRefresh();
 }).finally(()=>{cloudPendingSaves=Math.max(0,cloudPendingSaves-1)});
}
function cloudSetup(){
 const bar=document.createElement('div');
 bar.id='cloud-controls';bar.className='panel';

async function tmdbPosterCandidates(f){const key=(db.settings.tmdb||'').trim();if(!key)return [];let id=String(f.id).startsWith('tmdb:')?String(f.id).slice(5):'';const opts=key.startsWith('eyJ')?{headers:{Authorization:'Bearer '+key}}:{};const auth=url=>key.startsWith('eyJ')?url:url+(url.includes('?')?'&':'?')+'api_key='+encodeURIComponent(key);if(!id){const r=await fetch(auth('https://api.themoviedb.org/3/search/movie?query='+encodeURIComponent(f.title)));if(!r.ok)throw Error('TMDB search '+r.status);const d=await r.json();const candidates=(d.results||[]).filter(x=>normalizeMovieTitle(x.title)===normalizeMovieTitle(f.title));const match=candidates.find(x=>!f.year||(x.release_date||'').startsWith(String(f.year)));if(!match)return [];id=match.id}const r=await fetch(auth('https://api.themoviedb.org/3/movie/'+encodeURIComponent(id)+'/images?include_image_language=en,null,fr,de,es,it,ja'),opts);if(!r.ok)throw Error('TMDB images '+r.status);const d=await r.json();return (d.posters||[]).slice(0,35).map(x=>({url:'https://image.tmdb.org/t/p/w500'+x.file_path,source:'TMDB'+(x.iso_639_1?' · '+x.iso_639_1.toUpperCase():'')}))}

 const games=db.showdowns.filter(g=>subsetIds.has(g.a)&&subsetIds.has(g.b));const xgames=count(games,g=>g.axis==='X'),ygames=count(games,g=>g.axis==='Y');

function evaluateView(){let f=byId(activeFilm),tests=evalAxis==='Y'?yTests:xTests,step=evalAnswers.length,done=step>0&&(!evalAnswers[step-1].yes||step===tests.length),current=tests[Math.min(step,tests.length-1)],level=step?(evalAnswers[step-1].yes?evalAnswers[step-1].test.to:evalAnswers[step-1].test.from):(evalAxis==='Y'?0:5),names=evalAxis==='Y'?yNames:xNames;return `<div class="hero"><div class="eyebrow">The threshold discriminator</div><h1>Evaluate a Film</h1><p class="muted">Every level adds one condition the preceding level cannot establish.</p></div><section class="panel"><label>Film</label><select id="evalselect"><option value="">Choose a film…</option>${db.films.map(v=>`<option value="${esc(v.id)}" ${v.id===activeFilm?'selected':''}>${esc(v.title)} (${esc(v.year||'—')})</option>`).join('')}</select>${f?`<div class="row" style="margin:16px 0">${poster(f)}<div><h2 style="margin:0">${esc(f.title)}</h2><span class="muted">Saved coordinates: ${coord(f)||'Incomplete'}</span></div></div><div class="subtabs"><button class="btn ${evalAxis==='X'?'gold':''}" data-action="evalaxis" data-axis="X">X · Integrity</button><button class="btn ${evalAxis==='Y'?'gold':''}" data-action="evalaxis" data-axis="Y">Y · Recommendation</button></div>${!done?`<div class="notice"><div class="eyebrow">Threshold ${step+1} / ${tests.length} · ${current.gain}</div><h3 style="margin:12px 0">${current.q}</h3><p class="small">${evalAxis}${current.from} → ${evalAxis}${current.to}</p><div class="row"><button class="btn gold" data-action="evalanswer" data-yes="yes">Yes — established</button><button class="btn" data-action="evalanswer" data-yes="no">No — not established</button></div></div>`:`<div class="notice"><div class="eyebrow">Classification reached</div><h2 style="margin:8px 0">${evalAxis}${level} — ${names[level]}</h2><p class="small muted">Save the classification to update the master leaderboard.</p></div>`}<label>Evidence / rationale</label><textarea id="evalnotes">${esc(evalNotes)}</texta function filmJudgments(f){
 const gs=db.showdowns.filter(g=>g.a===f.id||g.b===f.id).sort((a,b)=>(b.at||0)-(a.at||0));
 if(!gs.length)return `<section class="dossier-judgments"><h3>Ordinal record</h3><p class="muted small">No head-to-head judgments recorded for this film yet.</p></section>`;
 const grouped=new Map();for(const g of gs){const other=g.a===f.id?g.b:g.a;if(!grouped.has(other))grouped.set(other,[]);grouped.get(other).push(g)}

}

}

$('view').addEventListener('click',e=>{let b=e.target.closest('button[data-action]');if(!b)return;let a=b.dataset.action,id=b.dataset.id;if(a==='go')go(b.dataset.page);if(a==='archivePair'){archiveSelectedPair=b.dataset.pair;render()}if(a==='ordinalPick'){ordinalCoord=b.dataset.coord;render()}if(a==='rankPage'){leaderboardPage+=b.dataset.dir==='next'?1:-1;render();window.scrollTo({top:0,behavior:'smooth'})}if(a==='save')saveFilm(id);if(a==='searchPoster')openPosterGallery(id);if(a==='details')openDetails(id);if(a==='openlist'){listOpen=id;render()}if(a==='closelist'){listOpen='';render()}if(a==='deletelist'){if(confirm('Delete this list? Films will remain in your collection.')){db.lists=db.lists.filter(l=>l.id!==id);persist();render()}}if(a==='removeFromList'){let l=db.lists.find(l=>l.id===b.dataset.list);if(l){l.ids=l.ids.filter(v=>v!==id);persist();render()}}if(a==='startEval'){activeFilm=id;evalAxis='X';evalAnswers=[];evalNotes=byId(id)?.xNote||'';if(byId(id)){byId(id).watched=true;persist()}closeModal();go('evaluate')}if(a==='evalaxis'){evalAxis=b.dataset.axis;evalAnswers=[];evalNotes=byId(activeFilm)?.[evalAxis.toLowerCase()+'Note']||'';render()}if(a==='evalanswer'){let tests=evalAxis==='X'?xTests:yTests;if(evalAnswers.length<tests.length){evalAnswers.push({test:tests[evalAnswers.length],yes:b.dataset.yes==='yes'});render()}}if(a==='evalback'){evalAnswers.pop();render()}if(a==='evalreset'){evalAnswers=[];render()}if(a==='evalsave'){let f=byId(activeFilm),t=evalAnswers.at(-1);if(f&&t){let lev=t.yes?t.test.to:t.test.from;f[evalAxis.toLowerCase()]=lev;f[evalAxis.toLowerCase()+'Note']=evalNotes;f.watched=true;persist();toast(evalAxis+lev+' saved');if(evalAxis==='X'){evalAxis='Y';evalAnswers=[];evalNotes=f.yNote||''}render()}}if(a==='showaxis'){showAxis=b.dataset.axis;showPair=null;render()}if(a==='skipPair'){let pairs=pendingPairs();if(pairs.length>1){let p=showPair&&pairs.find(q=>[q.a.id,q.b.id].sort().join('|')===[...showPair].sort().join('|'))||nextPair(),idx=pairs.findIndex(q=>q.a.id===p.a.id&&q.b.id===p.b.id);let next=pairs[(idx+1)%pairs.length];showPair=[next.a.id,next.b.id]}render()}if(a==='setPair'){let aa=byId($('pairA').value),bb=byId($('pairB').value);if(!aa||!bb||aa.id===bb.id||coord(aa)!==coord(bb)||bracket(aa)<0){toast('Select two different ranked films with identical X/Y coordinates');return}if(hasCompared(aa,bb,showAxis)){toast('This '+showAxis+' matchup is already completed. This decision is already recorded.');return}showPair=[aa.id,bb.id];render()}if(a==='win'){let fa=byId(b.dataset.a),fb=byId(b.dataset.b);if(!fa||!fb||fa.id===fb.id||coord(fa)!==coord(fb)||bracket(fa)<0){toast('Showdowns require identical ranked coordinates');return}if(hasCompared(fa,fb,showAxis)){toast('Already compared on this axis');return}db.showdowns.push({id:'show:'+uid(),a:fa.id,b:fb.id,winner:b.dataset.winner,axis:showAxis,coord:coord(fa),note:$('showdownNote')?.value.trim()||'',at:Date.now()});showPair=null;if(showAxis==='X'&&hasCompared(fa,fb,'X')&&!hasCompared(fa,fb,'Y')){showAxis='Y';showPair=[fa.id,fb.id]}persist();render();toast('Showdown recorded · leaderboard updated')}if(a==='reviseShowWinner'){const g=db.showdowns.find(v=>v.id===id),winner=b.dataset.winner;if(!g||!['X','Y'].includes(g.axis)||![g.a,g.b].includes(winner)){toast('This showdown cannot be revised');return}const fa=byId(g.a),fb=byId(g.b);if(!fa||!fb||coord(fa)!==coord(fb)||bracket(fa)<0){toast('Both films must still share the same ranked X/Y coordinates');return}const existing=prompt('Reconsider '+g.axis+' showdown: '+fa.title+' vs. '+fb.title+'\n\nEnter the revised decisive consideration:',g.note||'');if(existing===null)return;const note=existing.trim();if(!confirm('Save the revised '+g.axis+' verdict for '+(byId(winner)?.title||'selected film')+'? The prior verdict will remain in history, and ordinal standings will update.'))return;g.verdictHistory=Array.isArray(g.verdictHistory)?g.verdictHistory:[];g.verdictHistory.push({winner:g.winner,note:g.note||'',at:g.at||null,revisedAt:Date.now()});g.winner=winner;g.note=note;g.editedAt=Date.now();persist();render();toast('Revised verdict saved · ordinal standings updated')}if(a==='saveShowNote'){const g=db.showdowns.find(v=>v.id===id);const el=document.getElementById('archive-note-'+id);if(g&&el){const next=el.value.trim();if(next!==g.note){g.noteHistory=Array.isArray(g.noteHistory)?g.noteHistory:[];g.noteHistory.push({note:g.note||'',at:Date.now()});g.note=next;g.editedAt=Date.now()}persist();toast('Ordinal showdown commentary saved');render()}}if(a==='toggleHistory'){showdownHistoryVisible=!showdownHistoryVisible;render()}if(a==='deleteShow'){db.showdowns=db.showdowns.filter(s=>s.id!==id);persist();render();toast('Showdown undone')}if(a==='savekey'){db.settings.tmdb=$('tmdbkey').value.trim();persist();toast('Catalog settings saved')}if(a==='clearCollection')clearEntireCollection();if(a==='export')exportBackup()});
